# Local development services: PostgreSQL + MinIO (S3-compatible object storage).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reccora
      POSTGRES_PASSWORD: reccora
      POSTGRES_DB: reccora
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reccora"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reccora
      MINIO_ROOT_PASSWORD: reccora-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Creates the media bucket and makes objects publicly readable (dev only).
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 reccora reccora-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/reccora-media;
      mc anonymous set download local/reccora-media;
      exit 0;"

volumes:
  pgdata:
  miniodata:
